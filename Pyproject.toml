
[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ai-customer-support-env"
version = "1.0.0"
description = "OpenEnv-compliant AI Customer Support Training Environment"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
  { name = "AI Hackathon Team" }
]
keywords = [
  "openenv",
  "reinforcement-learning",
  "customer-support",
  "ai-training",
  "fastapi",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Framework :: FastAPI",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.0,<3",
  "pyyaml>=6.0",
  "openai>=1.35.0",
  "requests>=2.32.0",
  "python-multipart>=0.0.9",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27.0",
]

[project.urls]
Homepage   = "https://huggingface.co/spaces/deeps0408/openenvRL"
Repository = "https://github.com/your-username/ai-customer-support-env"
Issues     = "https://github.com/your-username/ai-customer-support-env/issues"

[tool.setuptools.packages.find]
where   = ["."]
include = ["environment*"]

[tool.setuptools.package-data]
"*" = ["openenv.yaml", "index.html", "README.md"]

[tool.pytest.ini_options]
testpaths    = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length    = 100
target-version = "py311"
